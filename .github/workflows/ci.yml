name: CI

# Runs on every push and pull request to main. The point is that code which
# breaks types, tests, or the production build never lands quietly.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "22"
  # Keep this in sync with .mise.toml (pinned to pnpm 10.34.3).
  # pnpm 10.x reads onlyBuiltDependencies/neverBuiltDependencies from
  # pnpm-workspace.yaml, while pnpm 11 uses allowBuilds. The workspace file
  # declares all three keys so either major version behaves the same way.
  PNPM_VERSION: "10.34.3"

jobs:
  # ───────────────────────────────────────────
  #  Frontend: types, tests, production build
  # ───────────────────────────────────────────
  frontend:
    name: Frontend (typecheck / test / build)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Unit tests
        run: pnpm run test

      - name: Build
        run: pnpm run build

      - name: Assert build output
        run: |
          set -euo pipefail
          test -f dist/index.html || { echo "::error::dist/index.html missing"; exit 1; }
          # The inference engine must be bundled, never fetched from a CDN:
          # background removal has to keep working with no network access.
          if grep -rq "cdn.jsdelivr.net" dist/assets/ 2>/dev/null; then
            echo "::error::External CDN reference found in dist/assets (ONNX must be served locally)"
            exit 1
          fi
          # The segmentation model has to reach the build output.
          test -f dist/models/u2netp.onnx || { echo "::error::u2netp.onnx missing from dist"; exit 1; }
          echo "Build output verified."

  # ──────────────────────────────────
  #  Backend: pytest
  # ──────────────────────────────────
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # The suite runs against a temporary SQLite file and does not need
      # rembg or onnxruntime, which live in requirements-ai.txt.
      - name: Run pytest
        env:
          DATABASE_URL: sqlite:///./test_ci.db
          STORAGE_ROOT: ./test_storage
        run: python -m pytest -q

  # ─────────────────────────────────────────────
  #  Assets: catch unfetched Git LFS pointers
  # ─────────────────────────────────────────────
  assets:
    name: Assets (no broken LFS pointers)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reject LFS pointer stubs
        run: |
          set -euo pipefail
          # An image, icon, model, or document under 200 bytes is an unfetched
          # LFS pointer, not a real asset. This repository does not currently
          # use LFS, and this guard keeps it that way.
          fail=0
          while IFS= read -r f; do
            [ -f "$f" ] || continue
            size=$(wc -c < "$f")
            if [ "$size" -lt 200 ]; then
              echo "::error file=$f::Asset is only ${size} bytes — looks like an unfetched LFS pointer"
              fail=1
            fi
          done < <(git ls-files -- '*.png' '*.jpg' '*.jpeg' '*.gif' '*.webp' '*.bmp' '*.ico' '*.svg' '*.onnx' '*.bin' '*.pdf' '*.woff' '*.woff2')
          [ "$fail" -eq 0 ] || exit 1
          echo "All tracked assets look like real binaries."
