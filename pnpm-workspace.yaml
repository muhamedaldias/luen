# ─────────────────────────────────────────────────────────────
#  pnpm workspace config — allow/deny dependency install scripts
#
#  Cross-version note:
#   - pnpm 10.x (pinned in .mise.toml and CI) reads
#     `onlyBuiltDependencies` as an allow-list and
#     `neverBuiltDependencies` as a deny-list.
#   - pnpm 11.x uses `allowBuilds` with boolean values.
#  All three keys are kept so either major version behaves the same and
#  avoids both ERR_PNPM_IGNORED_BUILDS and the native build failure for
#  the canvas package on CI.
#
#  - protobufjs: genuinely required by onnxruntime-web — its build is allowed.
#  - canvas: an optional dependency of fabric used only under Node. Nothing in
#    src/ imports it, and its native build needs cairo/pango, which usually
#    fails on Linux. Its build is denied.
#
#  Note: HEAD shipped this file with the raw template text
#  "set this to true or false", which is not valid syntax. Fixed.
# ─────────────────────────────────────────────────────────────

onlyBuiltDependencies:
  - protobufjs

neverBuiltDependencies:
  - canvas

allowBuilds:
  protobufjs: true
  canvas: false