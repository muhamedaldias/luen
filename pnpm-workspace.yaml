# ─────────────────────────────────────────────────────────────
#  pnpm workspace config — control which dependencies run install scripts
#
#  Only an allow-list is declared. pnpm 10 aborts with
#    ERR_PNPM_CONFIG_CONFLICT_BUILT_DEPENDENCIES
#  when both onlyBuiltDependencies and neverBuiltDependencies are present,
#  and it aborts before fetching a single package. Everything absent from
#  the allow-list has its install script skipped, so canvas is already
#  denied by omission and a separate deny-list is redundant.
#
#  - protobufjs: required by onnxruntime-web; its build is allowed.
#  - canvas: an optional dependency of fabric used only under Node. Nothing
#    in src/ imports it, and its native build needs cairo and pango, which
#    routinely fail on Linux runners, so it stays off the allow-list.
#
#  Historical note: HEAD shipped this file with the raw template text
#  "set this to true or false", which is not valid semantics for a build
#  allow-list. Fixed here.
# ─────────────────────────────────────────────────────────────

onlyBuiltDependencies:
  - protobufjs
